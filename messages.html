<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Messages :></title>
<link rel="icon" type="image/png" href="https://cdn-icons-png.magnific.com/512/8623/8623523.png">
<link href="https://api.fontshare.com/v2/css?f[]=sentient@200,400,700,200i,400i&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #050508;
    --text: #e8c97a;
    --text-dim: rgba(232,201,122,0.52);
    --text-faint: rgba(232,201,122,0.28);
    --accent: #e8a030;
    --line: rgba(232,201,122,0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Georgia', serif;
    min-height: 100vh;
  }

  #topo-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.35;
    pointer-events: none;
  }

  /* ── LOCK SCREEN ── */
  .lock-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5,5,8,0.96);
    backdrop-filter: blur(12px);
  }

  .lock-card {
    width: 100%;
    max-width: 400px;
    background: rgba(8,7,4,0.88);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 48px 40px;
    text-align: center;
    animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .lock-icon { font-size: 36px; margin-bottom: 24px; }

  .lock-title {
    font-family: 'Sentient', serif;
    font-style: italic;
    font-size: 26px;
    font-weight: 200;
    margin-bottom: 8px;
  }

  .lock-sub {
    font-family: 'Times New Roman', serif;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 32px;
    line-height: 1.65;
  }

  #pin-input {
    width: 100%;
    background: rgba(232,201,122,0.04);
    border: 1px solid rgba(232,201,122,0.15);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Times New Roman', serif;
    font-size: 20px;
    letter-spacing: 0.3em;
    text-align: center;
    padding: 14px 18px;
    outline: none;
    caret-color: var(--accent);
    transition: border-color 0.25s;
    margin-bottom: 16px;
  }

  #pin-input:focus { border-color: rgba(232,160,48,0.4); }

  #pin-input.shake {
    animation: shake 0.38s cubic-bezier(0.36,0.07,0.19,0.97) both;
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-3px); }
    20%, 80% { transform: translateX(5px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }

  #unlock-btn {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1px solid rgba(232,160,48,0.3);
    border-radius: 10px;
    color: var(--accent);
    font-family: 'Sentient', serif;
    font-size: 13px;
    letter-spacing: 0.09em;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  #unlock-btn:hover {
    background: rgba(232,160,48,0.08);
    border-color: var(--accent);
  }

  .lock-error {
    font-family: 'Times New Roman', serif;
    font-size: 12px;
    color: rgba(240,130,110,0.8);
    margin-top: 12px;
    min-height: 18px;
  }

  /* ── INBOX UI ── */
  .inbox-wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 80px 5vw 80px;
    display: none;
  }

  .inbox-wrap.visible { display: block; }

  .inbox-header {
    max-width: 860px;
    margin: 0 auto 40px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .inbox-title {
    font-family: 'Sentient', serif;
    font-style: italic;
    font-size: clamp(24px, 3.5vw, 42px);
    font-weight: 200;
  }

  .inbox-meta {
    font-family: 'Times New Roman', serif;
    font-size: 13px;
    color: var(--text-dim);
  }

  .inbox-actions {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .action-btn {
    padding: 8px 18px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text-dim);
    font-family: 'Times New Roman', serif;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }

  .action-btn:hover {
    border-color: rgba(232,160,48,0.35);
    color: var(--accent);
  }

  .action-btn.danger:hover {
    border-color: rgba(220,80,60,0.4);
    color: rgba(240,130,110,0.9);
    background: rgba(220,80,60,0.05);
  }

  /* ── FILTER BAR ── */
  .filter-bar {
    max-width: 860px;
    margin: 0 auto 30px;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  #search-input {
    flex: 1;
    background: rgba(232,201,122,0.03);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Times New Roman', serif;
    font-size: 13px;
    padding: 9px 14px;
    outline: none;
    caret-color: var(--accent);
    transition: border-color 0.2s;
  }

  #search-input:focus { border-color: rgba(232,160,48,0.3); }
  #search-input::placeholder { color: var(--text-faint); }

  /* ── MESSAGE CARDS ── */
  .messages-list {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg-card {
    background: rgba(232,201,122,0.025);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 26px;
    position: relative;
    transition: border-color 0.25s, transform 0.2s;
    animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-card:hover {
    border-color: rgba(232,160,48,0.22);
    transform: translateY(-2px);
  }

  .msg-card.unread::before {
    content: '';
    position: absolute;
    top: 18px; left: -1px;
    width: 3px; height: 36px;
    background: var(--accent);
    border-radius: 0 3px 3px 0;
    opacity: 0.6;
  }

  .msg-text {
    font-family: 'Times New Roman', serif;
    font-size: 15px;
    line-height: 1.82;
    color: var(--text);
    margin-bottom: 18px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .msg-location {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Times New Roman', serif;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .loc-icon { opacity: 0.5; flex-shrink: 0; }

  .msg-time {
    font-family: 'Times New Roman', serif;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }

  .msg-delete {
    background: none;
    border: none;
    color: rgba(232,201,122,0.15);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    transition: color 0.2s;
    line-height: 1;
    font-size: 16px;
  }

  .msg-delete:hover { color: rgba(240,130,110,0.7); }

  /* ── EMPTY STATE ── */
  .empty-state {
    max-width: 860px;
    margin: 80px auto 0;
    text-align: center;
    display: none;
  }

  .empty-state.visible { display: block; }

  .empty-icon { font-size: 40px; opacity: 0.25; margin-bottom: 18px; }

  .empty-label {
    font-family: 'Sentient', serif;
    font-style: italic;
    font-size: 22px;
    font-weight: 200;
    color: var(--text-faint);
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(232,201,122,0.16); border-radius: 4px; }

  @media (max-width: 600px) {
    .inbox-wrap { padding: 60px 18px 60px; }
  }
</style>
</head>
<body>

<canvas id="topo-canvas"></canvas>

<!-- ── LOCK SCREEN ── -->
<div class="lock-screen" id="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <h1 class="lock-title">Whisper Inbox</h1>
    <p class="lock-sub">This is a private space.<br>Enter the passphrase to continue.</p>
    <input
      type="password"
      id="pin-input"
      placeholder="········"
      autocomplete="off"
      maxlength="64"
    >
    <button id="unlock-btn">Unlock</button>
    <p class="lock-error" id="lock-error"></p>
  </div>
</div>

<!-- ── INBOX ── -->
<div class="inbox-wrap" id="inbox-wrap">
  <div class="inbox-header">
    <div>
      <h1 class="inbox-title">Whisper Inbox</h1>
    </div>
    <div class="inbox-actions">
      <span class="inbox-meta" id="msg-count">0 messages</span>
      <button class="action-btn" id="mark-all-btn">Mark all read</button>
      <button class="action-btn danger" id="clear-btn">Clear all</button>
      <button class="action-btn" id="lock-btn">Lock</button>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" id="search-input" placeholder="Search messages…">
  </div>

  <div class="messages-list" id="messages-list"></div>
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">✉</div>
    <p class="empty-label">No whispers yet.</p>
  </div>
</div>

<script>
/* ────────────────────────────────────────────
   TOPO CANVAS
──────────────────────────────────────────── */
(function() {
  var canvas = document.getElementById('topo-canvas');
  var ctx    = canvas.getContext('2d');
  var W, H, frame = 0, RES = 180;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  function generate(t) {
    var Z=[], f1=0.8+0.3*Math.sin(t*0.1), f2=0.9+0.3*Math.cos(t*0.15);
    var dx=Math.sin(t*0.13)*3.2, dy=Math.cos(t*0.17)*2.6;
    for(var j=0;j<RES;j++){Z[j]=[];var gy=(j/(RES-1))*12-6;for(var i=0;i<RES;i++){var gx=(i/(RES-1))*12-6;var wx=Math.sin(gy*f1+t*0.4)*1.6+dx,wy=Math.cos(gx*f2-t*0.3)*1.6+dy;var nx=gx*0.7+wx,ny=gy*0.7+wy;var z=Math.sin(nx*1.2+Math.cos(ny*0.9+t*0.2))*Math.cos(ny*1.3+Math.sin(nx*0.8-t*0.2));z+=0.8*Math.sin(nx*0.6+t*0.3)*Math.cos(ny*0.4-t*0.1);z+=0.5*Math.cos(nx*1.5-ny*1.1+t*0.4);Z[j][i]=z;}}
    return Z;
  }
  function lerp(a,b,va,vb,th){if(Math.abs(vb-va)<1e-9)return a;return a+(b-a)*(th-va)/(vb-va);}
  var CASES={1:[3,0],2:[0,1],3:[3,1],4:[1,2],5:[3,0,1,2],6:[0,2],7:[3,2],8:[2,3],9:[0,2],10:[0,1,2,3],11:[1,2],12:[3,1],13:[0,1],14:[3,0]};
  function draw(){ctx.clearRect(0,0,W,H);var t=frame*0.016,sx=W/(RES-1),sy=H/(RES-1),Z=generate(t),LEVELS=12,zMin=-2.3,zMax=2.3;ctx.strokeStyle='rgba(232,201,122,0.55)';ctx.lineWidth=1.0;for(var lv=0;lv<LEVELS;lv++){var th=zMin+(lv/(LEVELS-1))*(zMax-zMin);ctx.beginPath();for(var j=0;j<RES-1;j++){for(var i=0;i<RES-1;i++){var z00=Z[j][i],z10=Z[j][i+1],z01=Z[j+1][i],z11=Z[j+1][i+1];var sq=(z00>=th?1:0)|(z10>=th?2:0)|(z11>=th?4:0)|(z01>=th?8:0);if(sq===0||sq===15)continue;var x0=i*sx,x1=(i+1)*sx,y0=j*sy,y1=(j+1)*sy;var pts=[[lerp(x0,x1,z00,z10,th),y0],[x1,lerp(y0,y1,z10,z11,th)],[lerp(x0,x1,z01,z11,th),y1],[x0,lerp(y0,y1,z00,z01,th)]];var idx=CASES[sq];if(!idx)continue;ctx.moveTo(pts[idx[0]][0],pts[idx[0]][1]);ctx.lineTo(pts[idx[1]][0],pts[idx[1]][1]);if(idx.length===4){ctx.moveTo(pts[idx[2]][0],pts[idx[2]][1]);ctx.lineTo(pts[idx[3]][0],pts[idx[3]][1]);}}}ctx.stroke();}frame++;requestAnimationFrame(draw);}
  draw();
})();

/* ────────────────────────────────────────────
   PASSPHRASE  ← change this to whatever you want
──────────────────────────────────────────── */
var SECRET = 'gorga2026';   // ← ganti passphrase di sini

/* ────────────────────────────────────────────
   LOCK / UNLOCK
──────────────────────────────────────────── */
var lockScreen = document.getElementById('lock-screen');
var inboxWrap  = document.getElementById('inbox-wrap');
var pinInput   = document.getElementById('pin-input');
var unlockBtn  = document.getElementById('unlock-btn');
var lockError  = document.getElementById('lock-error');
var SESSION_KEY = 'whisper_unlocked';

function unlock() {
  if (pinInput.value === SECRET) {
    sessionStorage.setItem(SESSION_KEY, '1');
    lockScreen.style.display = 'none';
    inboxWrap.classList.add('visible');
    renderMessages();
  } else {
    lockError.textContent = 'Wrong passphrase.';
    pinInput.classList.remove('shake');
    void pinInput.offsetWidth;
    pinInput.classList.add('shake');
    pinInput.value = '';
    setTimeout(function() { lockError.textContent = ''; }, 2500);
  }
}

if (sessionStorage.getItem(SESSION_KEY) === '1') {
  lockScreen.style.display = 'none';
  inboxWrap.classList.add('visible');
}

unlockBtn.addEventListener('click', unlock);
pinInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') unlock(); });

document.getElementById('lock-btn').addEventListener('click', function() {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
});

/* ────────────────────────────────────────────
   MESSAGES
──────────────────────────────────────────── */
function getMessages() {
  try { return JSON.parse(localStorage.getItem('whisper_messages') || '[]'); }
  catch(e) { return []; }
}

function saveMessages(msgs) {
  localStorage.setItem('whisper_messages', JSON.stringify(msgs));
}

function formatTime(iso) {
  var d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
       + '  ·  '
       + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

var searchInput   = document.getElementById('search-input');
var messagesList  = document.getElementById('messages-list');
var emptyState    = document.getElementById('empty-state');
var msgCountEl    = document.getElementById('msg-count');

function renderMessages() {
  var messages = getMessages();
  var query    = searchInput.value.trim().toLowerCase();
  var filtered = query
    ? messages.filter(function(m) { return m.text.toLowerCase().includes(query) || (m.location||'').toLowerCase().includes(query); })
    : messages;

  /* sort newest first */
  filtered = filtered.slice().sort(function(a,b) { return b.id - a.id; });

  msgCountEl.textContent = messages.length + (messages.length === 1 ? ' message' : ' messages');
  messagesList.innerHTML = '';

  if (filtered.length === 0) {
    emptyState.classList.add('visible');
    return;
  }
  emptyState.classList.remove('visible');

  var unreadIds = {};
  try { unreadIds = JSON.parse(localStorage.getItem('whisper_read') || '{}'); } catch(e) {}

  filtered.forEach(function(msg, idx) {
    var isUnread = !unreadIds[msg.id];
    var card = document.createElement('div');
    card.className = 'msg-card' + (isUnread ? ' unread' : '');
    card.style.animationDelay = (idx * 0.05) + 's';

    card.innerHTML =
      '<p class="msg-text">' + escapeHtml(msg.text) + '</p>' +
      '<div class="msg-footer">' +
        '<span class="msg-location">' +
          '<svg class="loc-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>' +
          escapeHtml(msg.location || 'Unknown') +
        '</span>' +
        '<span class="msg-time">' + formatTime(msg.time) + '</span>' +
        '<button class="msg-delete" data-id="' + msg.id + '" title="Delete">✕</button>' +
      '</div>';

    /* mark read on view */
    unreadIds[msg.id] = 1;

    card.querySelector('.msg-delete').addEventListener('click', function(e) {
      e.stopPropagation();
      deleteMessage(parseInt(this.dataset.id));
    });

    messagesList.appendChild(card);
  });

  localStorage.setItem('whisper_read', JSON.stringify(unreadIds));
}

function deleteMessage(id) {
  var msgs = getMessages().filter(function(m) { return m.id !== id; });
  saveMessages(msgs);
  renderMessages();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

searchInput.addEventListener('input', renderMessages);

document.getElementById('mark-all-btn').addEventListener('click', function() {
  var msgs = getMessages();
  var read = {};
  msgs.forEach(function(m) { read[m.id] = 1; });
  localStorage.setItem('whisper_read', JSON.stringify(read));
  renderMessages();
});

document.getElementById('clear-btn').addEventListener('click', function() {
  if (confirm('Delete all whisper messages? This cannot be undone.')) {
    localStorage.removeItem('whisper_messages');
    localStorage.removeItem('whisper_read');
    renderMessages();
  }
});

if (inboxWrap.classList.contains('visible')) renderMessages();
</script>
</body>
</html>
